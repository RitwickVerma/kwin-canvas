# What a container with no compositor can still check: the metadata linter, QML
# and shell parse errors, shellcheck at error severity, the dead-code census,
# vulture over the Python, and the tools and fixture builds. The jobs run the
# same `make lint-*` targets a local machine runs, so a red pipeline can be
# reproduced here. The scenarios drive a nested KWin with real windows and
# virtual outputs, so they stay local; see docs/testing.md. A runner that can
# host a KWin session can add `tests/run.sh` to the same stage.

# Prebuilt on the runner (ci/Dockerfile) so jobs do not run pacman -Syu each. Override with
# KWIN_CI_IMAGE=archlinux:latest if the image is ever missing; the before_script then installs.
variables:
  KWIN_CI_IMAGE: localhost/kwin-canvas-ci:latest

image: $KWIN_CI_IMAGE

stages: [check, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  before_script:
    # The job runs as root in a checkout the runner owns.
    # ORDER MATTERS: pacman installs git, so it must run before the first git call.
    # (Reversed, every job died `git: command not found` -> exit 127 before its script ran.)
    # Install only if this is not the CI image (override or fallback) or it is stale (ci/packages.txt changed).
    - '[ "$(cat /etc/ci-packages 2>/dev/null)" = "$(cat ci/packages.txt)" ] || pacman -Syu --noconfirm --needed --quiet $(cat ci/packages.txt)'
    - git config --global --add safe.directory '*'

reuse:
  stage: check
  script:
    - make lint-reuse

qml:
  stage: check
  script:
    - make lint-qml

shell:
  stage: check
  script:
    - make lint-shell

shader:
  stage: check
  script:
    - make lint-shader

deadcode:
  stage: check
  script:
    - make lint-deadcode

python:
  stage: check
  script:
    - make lint-python

unit:
  stage: check
  script:
    - make unit

build:
  stage: build
  script:
    - make tools
    # The fixtures in the tree are the generator's output; they must stay in step. Compared by
    # pixels, not bytes: a PNG's bytes follow the zlib that wrote it. The labels need DejaVu.
    - make fixtures-check
