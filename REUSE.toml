# Some files cannot carry SPDX headers: PNGs, the JSON and XML that KWin parses,
# VERSION (read with `cat`), and the text fixtures the scenarios type into
# windows. REUSE 3.3 allows listing them here once instead. Files this fork
# added are attributed to whoever wrote them; the rest is upstream's.

version = 1

[[annotations]]
path = [
    "VERSION",
    "README.md",
    "docs/architecture.md",
    "docs/install.md",
    "docs/release-notes.md",
    "docs/tour.md",
    "docs/shader-integration.md",
    "docs/images/**",
    "effect/metadata.json",
    "effect/contents/config/main.xml",
    "applet/metadata.json",
    "wallpaper/metadata.json",
    "wallpaper/contents/config/main.xml",
    "plugin/metadata.json",
    "packaging/PKGBUILD.in",
    "packaging/PKGBUILD-passthrough.in",
    "packaging/kwin-canvas.install",
    "tools/fakeinput.desktop.in",
    "tests/fixtures/**",
    "tests/golden/after-commit-1to1.png",
    "tests/golden/extents.png",
    "tests/golden/hidden-frame.png",
    "tests/golden/input-dragged.png",
    "tests/golden/open-1to1.png",
    "tests/golden/resized.png",
    "tests/golden/three-activities.png",
    "tests/golden/zoom-pan.png",
]
SPDX-FileCopyrightText = "2026 Aaron Bockelie <aaronsb@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"

